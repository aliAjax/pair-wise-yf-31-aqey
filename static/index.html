<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>航班恢复控制台</title>
<style>
body{font:15px system-ui;max-width:1180px;margin:32px auto;background:#eef2f7;color:#182230;padding:0 20px}
section{background:white;padding:18px 20px;border-radius:12px;margin:16px 0;box-shadow:0 2px 10px #0001}
h2{margin:0 0 10px;font-size:17px}
input,button,select,textarea{font:inherit;padding:7px;margin:3px}
button{background:#0f766e;color:white;border:0;border-radius:6px;cursor:pointer}
button.ghost{background:#475569}
button.danger{background:#b45309}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid #e5e7eb;padding:6px 8px;text-align:left;vertical-align:top}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;color:white}
.applied{background:#15803d}.conflict{background:#b45309}.failed{background:#b91c1c}.queued,.processing{background:#1d4ed8}
.blocked{background:#b45309}.pending{background:#1d4ed8}.superseded{background:#64748b}.resolved{background:#15803d}
details summary{cursor:pointer;color:#0f766e}
pre{background:#111827;color:#93c5fd;padding:12px;overflow:auto;border-radius:8px;font-size:12px;max-height:320px}
.muted{color:#64748b}
</style>
<h1>航班恢复控制台</h1>
<p class="muted">查看航班、方案与离线批次合并结果。写操作请携带 X-User-Id、X-Role。</p>
<section>
  身份 <input id="u" value="sched" style="width:90px"> 角色
  <select id="r"><option>scheduler</option><option>ops_manager</option><option>auditor</option><option>viewer</option></select>
  <button onclick="load()">刷新</button>
  <button class="ghost" onclick="recoverQueue()">重启恢复队列</button>
  <span id="summary" class="muted"></span>
</section>
<section>
  <h2>待处理冲突</h2>
  <div id="conflicts"></div>
</section>
<section>
  <h2>离线批次（合并结果 / 失败原因 / 重试入口）</h2>
  <div id="batches"></div>
</section>
<section>
  <h2>恢复方案</h2>
  <div id="plans"></div>
</section>
<section><h2>原始状态</h2><pre id="o"></pre></section>

<script>
let STATE=null;
function headers(extra){return Object.assign({'X-User-Id':u.value,'X-Role':r.value,'Content-Type':'application/json'},extra||{})}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function pill(status){return `<span class="pill ${status}">${status}</span>`}
async function api(path,method,body){
  let x=await fetch(path,{method:method||'GET',headers:headers(),body:body?JSON.stringify(body):undefined});
  return {status:x.status,json:await x.json()};
}
async function load(){
  STATE=(await api('/api/state')).json;
  o.textContent=JSON.stringify(STATE,null,2);
  let q=STATE.queue_summary||{};
  summary.innerHTML=`队列：${q.queued||0} 待处理 · ${q.processing||0} 进行中 · <b>${q.failed||0} 失败</b> · <b>${q.conflict||0} 有冲突</b> · ${q.open_conflicts||0} 条待处理冲突`;
  renderConflicts();renderBatches();renderPlans();
}
function renderConflicts(){
  let rows=(STATE.open_conflicts||[]).filter(c=>c.status==='open');
  if(!rows.length){conflicts.innerHTML='<p class="muted">无待处理冲突</p>';return}
  conflicts.innerHTML='<table><tr><th>批次</th><th>方案</th><th>航班</th><th>类型</th><th>资源</th><th>说明</th><th></th></tr>'+
    rows.map(c=>`<tr><td>#${c.batch_id}</td><td>#${c.plan_id}</td><td>${c.flight_id??'—'}</td><td>${pill(c.conflict_type)}</td>
      <td>${esc(c.resource)||'—'}</td><td>${esc(c.message)}</td>
      <td>${c.conflict_type==='concurrent_reassign'&&c.flight_id?`<button class="danger" onclick="retryKeep(${c.batch_id},${c.flight_id})">采用后到方案并重试</button>`
        :`<button onclick="retrySimple(${c.batch_id})">重新校验并重试</button>`}</td></tr>`).join('')+'</table>';
}
function renderBatches(){
  let rows=STATE.offline_batches||[];
  if(!rows.length){batches.innerHTML='<p class="muted">暂无离线批次</p>';return}
  batches.innerHTML='<table><tr><th>#</th><th>方案</th><th>设备</th><th>状态</th><th>基线→合并修订</th><th>断点</th><th>操作</th><th>失败原因 / 合并结果</th></tr>'+
    rows.map(b=>`<tr><td>${b.id}</td><td>#${b.plan_id}</td><td>${esc(b.device_id)||'—'}</td><td>${pill(b.status)}</td>
      <td>r${b.base_revision} → ${b.merged_revision!=null?'r'+b.merged_revision:'—'}</td><td>seq ${b.checkpoint_seq}</td>
      <td>${(b.status==='failed'||b.status==='conflict')?`<button onclick="retrySimple(${b.id})">从断点重试</button>`:''}</td>
      <td>${b.error_code?`<b class="${b.status==='failed'?'':''}">${esc(b.error_code)}</b>: ${esc(b.error_message)}`:''}
        <details><summary>详情 (${(b.pending_conflicts||[]).filter(c=>c.status==='open').length} 待处理)</summary>
        <b>操作：</b>${(b.operations||[]).map(o=>`seq${o.seq} ${o.op_type} ${o.flight_id??esc(o.resource_id)} ${pill(o.status)}${o.error_message?'：'+esc(o.error_message):''}`).join('<br>')}
        ${b.result?'<pre>'+esc(JSON.stringify(b.result,null,2))+'</pre>':''}</details></td></tr>`).join('')+'</table>';
}
function renderPlans(){
  plans.innerHTML='<table><tr><th>#</th><th>名称</th><th>状态</th><th>修订</th><th>改派数</th><th>成本分</th></tr>'+
    (STATE.plans||[]).map(p=>`<tr><td>${p.id}</td><td>${esc(p.name)}</td><td>${pill(p.status)}</td><td>r${p.revision}</td>
      <td>${(p.assignments||[]).length}</td><td>${p.score?p.score.cost_score:'—'}</td></tr>`).join('')+'</table>';
}
async function retrySimple(id){
  let r=await api(`/api/batches/${id}/retry`,'POST',{resolutions:[]});
  alert(r.status===202?'已从断点重试':`${r.status}: ${r.json.message||r.json.error}`);load();
}
async function retryKeep(id,flightId){
  let r=await api(`/api/batches/${id}/retry`,'POST',{resolutions:[{flight_id:flightId}]});
  alert(r.status===202?'已采用后到方案并重试':`${r.status}: ${r.json.message||r.json.error}`);load();
}
async function recoverQueue(){
  let r=await api('/api/queues/recover/offline','POST');
  alert(r.status===200?('已恢复批次: '+JSON.stringify(r.json.recovered_batches)):`${r.status}: ${r.json.message||r.json.error}`);load();
}
load();
</script>
